name: Release AAB

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build signed release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure local.properties exists
        run: touch local.properties

      - name: Decode upload keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/retrocade-upload.jks"

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Release lint
        run: ./gradlew lintRelease --stacktrace

      - name: Build signed AAB
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/retrocade-upload.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_GAME_START: ${{ secrets.ADMOB_INTERSTITIAL_GAME_START }}
          BILLING_LIFETIME_ID: ${{ secrets.BILLING_LIFETIME_ID }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: retrocade-${{ github.ref_name }}-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: retrocade-${{ github.ref_name }}-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
